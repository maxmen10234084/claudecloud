name: Automaton bauen

on:
  push:
    paths:
      - automaton
      - scripts/automaton-setup.sh
      - .github/workflows/automaton.yml
  pull_request:
    paths:
      - automaton
      - scripts/automaton-setup.sh
      - .github/workflows/automaton.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Einrichten und bauen
        run: sh scripts/automaton-setup.sh
